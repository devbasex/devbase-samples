name: devbase-samples
description: "devbase公式サンプルプラグインレジストリ"
maintainer: devbasex
official: false

plugins:
  - name: adminer
    path: adminer/
    description: "Adminer - 軽量DB管理ツール（PHPコンテナ）"

  - name: ai-plugins
    path: ai-plugins/
    description: "devbasex/ai-plugins - Claude Code プラグインマーケットプレイスと devbase 本体の開発環境（複数リポジトリ構成の例）"

  - name: devbase
    path: devbase/
    description: "devbase本体の開発環境"

  - name: github_work_time
    path: github_work_time/
    description: "github_work_time - GitHubアクティビティから稼働時間を集計するツールの開発環境"

  - name: md-specgen
    path: md-specgen/
    description: "md-specgen - Markdown仕様書自動生成ツールの開発環境"

  - name: tmllib
    path: tmllib/
    description: "tmllib - 共通ライブラリ開発環境"
